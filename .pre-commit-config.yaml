repos:
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5  # SHA of v1.3.5
    hooks:
      - id: cpplint
        args: ["--filter=-legal/copyright,-build/header_guard,-whitespace/line_length"]
      - id: cppcheck
        args: [--enable=all, -I /usr/include/box2d]
      - id: clang-format
